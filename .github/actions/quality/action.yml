name: Workspace quality
description: Run the same full Lefthook gate used before local commits
runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.47.2'
        channel: stable
    - name: Set up hook and real recording test tools
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew install lefthook ffmpeg
    - name: Verify the complete candidate
      shell: bash
      run: lefthook run pre-commit --all-files
