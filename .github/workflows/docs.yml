name: Documentation

on:
  pull_request:
    branches: [develop]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'example/**'
      - 'docs/SPEC.md'
      - 'docs/ARCHITECTURE.md'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [develop]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'example/**'
      - 'docs/SPEC.md'
      - 'docs/ARCHITECTURE.md'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: website/.tool-versions
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting and bilingual content
        run: |
          bun run format:check
          bun run check
      - name: Build and check links
        run: bun run build
      - name: Install browser
        run: bun run --bun playwright install --with-deps chromium
      - name: Check desktop, mobile, search, and language switching
        run: bun run test
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-browser-report
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
