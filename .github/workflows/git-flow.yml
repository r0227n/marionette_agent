name: Git flow

on:
  pull_request:
    branches: [develop, main, 'release/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: git-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Git flow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test automation without network or mutations
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate PR route and release metadata
        run: python3 .github/scripts/git_flow.py policy
