name: marionette_agent
description: A session-based CLI for Marionette-enabled Flutter apps.
version: 0.0.1
publish_to: none
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.2

# Add regular dependencies here.
dependencies:
  marionette_agent_util:
    path: ../marionette_agent_util
  # PNG/JPEG codec internal APIs are isolated in artifact_writer.dart.
  image: 4.9.1
  yaml: 3.1.4
  args: ^2.7.0
  collection: ^1.19.1
  vm_service: ^15.3.0
  logging: ^1.3.0
  marionette_mcp: 0.6.0
  path: ^1.9.1
  dart_mcp: 0.5.2
  json_rpc_2: ^4.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  marionette-agent: marionette_agent
