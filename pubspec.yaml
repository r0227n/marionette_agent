name: marionette_agent
description: A session-based CLI for Marionette-enabled Flutter apps.
version: 1.0.0
publish_to: none
repository: https://github.com/r0227n/marionette_agent

environment:
  sdk: ^3.13.2

workspace:
  - packages/marionette_agent_platform_interface
  - packages/marionette_agent_ios
  - packages/marionette_agent_android
  - packages/marionette_agent_macos
  - packages/marionette_agent_web
  - packages/marionette_agent_flutter
  - example

dependencies:
  marionette_agent_platform_interface:
    path: packages/marionette_agent_platform_interface
  marionette_agent_ios:
    path: packages/marionette_agent_ios
  marionette_agent_android:
    path: packages/marionette_agent_android
  marionette_agent_macos:
    path: packages/marionette_agent_macos
  marionette_agent_web:
    path: packages/marionette_agent_web
  marionette_agent_flutter:
    path: packages/marionette_agent_flutter
  # PNG/JPEG codec internal APIs are isolated in artifact_writer.dart.
  image: 4.9.1
  yaml: 3.1.4
  args: ^2.7.0
  collection: ^1.19.1
  vm_service: ^15.3.0
  logging: ^1.3.0
  marionette_mcp: 0.6.0
  path: ^1.9.1
  dart_mcp: 0.5.2
  json_rpc_2: ^4.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  marionette-agent: marionette_agent
